services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: aimafia
      POSTGRES_PASSWORD: aimafia
      POSTGRES_DB: aimafia
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U aimafia']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # Ollama is optional for Phase 1-3. Uncomment to run the model in a container,
  # or use a host install (recommended for GPU access). The server reaches it via
  # OLLAMA_BASE_URL.
  # ollama:
  #   image: ollama/ollama:latest
  #   restart: unless-stopped
  #   ports:
  #     - '11434:11434'
  #   volumes:
  #     - ollamadata:/root/.ollama

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      SERVER_PORT: 4000
      CORS_ORIGIN: http://localhost:3000
      DATABASE_URL: postgresql://aimafia:aimafia@postgres:5432/aimafia?schema=public
      REDIS_URL: redis://redis:6379
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: llama3.2
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '4000:4000'

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_SERVER_URL: http://localhost:4000
    restart: unless-stopped
    depends_on:
      - server
    environment:
      NEXT_PUBLIC_SERVER_URL: http://localhost:4000
    ports:
      - '3000:3000'

volumes:
  pgdata:
  redisdata:
  # ollamadata:
